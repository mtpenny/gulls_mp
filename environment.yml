name: gulls
channels:
  - conda-forge
dependencies:
  # Pin Python for reproducible CI builds (conda-forge may otherwise select
  # very new versions that are not yet well-supported by all doc tooling).
  - python=3.12.*
  - cmake
  - gsl
  - cfitsio
  - compilers
  - matplotlib
  - pandas
  - astropy
  - numpy
  # Pin Sphinx to avoid incompatibilities with older theme templates.
  - sphinx=6.2.*
  - sphinx_rtd_theme=1.3.*
  - pip
  - pip:
      - VBMicrolensing
